<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Card Top Banner Gradient -->
    <linearGradient id="cardHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Card Border Accent Gradient -->
    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Drop Shadow for Standout Depth -->
    <filter id="boldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Transparent Background -->

  <!-- Single Large Minimalist Card -->
  <g filter="url(#boldShadow)" transform="translate(96, 64)">
    <!-- Main Card Body -->
    <rect x="0" y="0" width="320" height="384" rx="28" fill="#1e293b" stroke="url(#cardBorderGrad)" stroke-width="6" />

    <!-- Large Header Art Block -->
    <rect x="24" y="24" width="272" height="140" rx="18" fill="url(#cardHeaderGrad)" />
    <circle cx="160" cy="94" r="32" fill="#ffffff" opacity="0.18" />
    <path d="M 144 94 L 160 78 L 176 94 L 160 110 Z" fill="#ffffff" opacity="0.9" />

    <!-- Minimalist Big UI Blocks (High Visibility) -->
    <!-- Title Bar -->
    <rect x="24" y="192" width="160" height="20" rx="10" fill="#f8fafc" />
    <rect x="200" y="192" width="36" height="20" rx="10" fill="#38bdf8" />

    <!-- Content Lines -->
    <rect x="24" y="232" width="232" height="14" rx="7" fill="#64748b" />
    <rect x="24" y="258" width="180" height="14" rx="7" fill="#64748b" />

    <!-- Tag Pills -->
    <rect x="24" y="312" width="60" height="32" rx="10" fill="#334155" />
    <rect x="96" y="312" width="60" height="32" rx="10" fill="#334155" />
  </g>

  <!-- Big Minimalist Pencil Badge -->
  <g transform="translate(320, 310)" filter="url(#boldShadow)">
    <circle cx="56" cy="56" r="56" fill="#a855f7" />
    <!-- Material Pencil Icon Scale-up -->
    <path transform="translate(31, 31) scale(2.1)" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="#ffffff" />
  </g>
</svg>