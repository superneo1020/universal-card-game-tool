<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 46" width="48" height="46">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect x="4" y="3" width="32" height="40" rx="4" fill="#1e293b" stroke="url(#accentGradient)" stroke-width="1" />

    <!-- Header Banner -->
    <rect x="8" y="7" width="24" height="16" rx="2.5" fill="url(#primaryCard)" />
    <path d="M 20 11 L 23 15 L 17 15 Z" fill="#ffffff" opacity="0.9" />

    <!-- Bold Title & Subtitle Bars (No tiny text clutter) -->
    <rect x="8" y="27" width="18" height="3.5" rx="1.75" fill="#f8fafc" />
    <rect x="8" y="33" width="12" height="2.5" rx="1.25" fill="#64748b" />
  </g>

  <!-- Clean Edit Badge -->
  <g transform="translate(30, 28)">
    <circle cx="8" cy="8" r="8" fill="#a855f7" />
    <path transform="translate(4.2, 4.2) scale(0.32)" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="#ffffff" />
  </g>
</svg>